name: exynos7870 kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eleven
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential cpio
      - name: toolchain
        run: |
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz -C $HOME
      - name: build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$HOME/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu/bin/aarch64-linux-gnu-
          export ANDROID_MAJOR_VERSION=q ANDROID_PLATFORM_VERSION=10
          make O=out exynos7870-on7xelte_defconfig
          make O=out -j$(nproc)
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-on7xelte
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
            out/.config
