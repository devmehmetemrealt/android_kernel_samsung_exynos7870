name: exynos7870 kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eleven
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential cpio
      - name: toolchain
        run: |
          git clone --depth 1 --branch lineage-18.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 $HOME/toolchain
      - name: build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$HOME/toolchain/bin/aarch64-linux-android-
          export HOSTCC="gcc -fcommon"
          export ANDROID_MAJOR_VERSION=q ANDROID_PLATFORM_VERSION=10
          make O=out exynos7870-on7xelte_defconfig
          make O=out -j$(nproc)
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-on7xelte
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dts/**/*.dtb
            out/.config
